[package]
name = "mixin_desktop_ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["unstable-locales"] }
directories = "6"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
mixin_desktop_api = { path = "../mixin_desktop_api" }
serde_json = "1"
sha2 = "0.11"
url = "2"
regex = "1"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "time", "net", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }
webkit6 = "0.6"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSImageView", "NSPanel"] }
objc2-user-notifications = "0.3"
block2 = "0.6"
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "UI_Notifications",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_WinRT",
    "Win32_UI_Notifications",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
] }
