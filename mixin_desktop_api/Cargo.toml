[package]
name = "mixin_desktop_api"
version = "0.1.0"
edition = "2021"

[features]
specta = ["dep:serde", "dep:specta", "mixin_desktop_core/specta"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
chrono = "0.4"
futures = "0.3"
log = "0.4"
mixin_desktop_core = { path = "../mixin_desktop_core" }
sdk = { path = "../mixin-bot-sdk", package = "mixin-bot-sdk" }
serde_json = "1"
serde = { version = "1", features = ["derive"], optional = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mixin_desktop_media = { path = "../mixin_desktop_media" }
