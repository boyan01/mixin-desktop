[package]
name = "mixin_desktop_media"
version = "0.1.0"
edition = "2021"

[features]
specta = ["dep:serde", "dep:specta"]

[dependencies]
cpal = "0.18.1"
ogg = "0.9.2"
opus-head-sys = { version = "0.3.1", default-features = false, features = ["fast-math"] }
rand = "0.9"
serde = { version = "1", features = ["derive"], optional = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
wsola = "0.1.0"
