[package]
name = "mixin_desktop_media"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
blurhash = { version = "=0.2.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
mime_guess = "2"
serde_json = "1"
tempfile = "3"
zip = { version = "2.4.2", default-features = false, features = ["deflate", "aes-crypto"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18.1"
ogg = "0.9.2"
opus-head-sys = { version = "0.3.1", default-features = false, features = ["fast-math"] }
rand = "0.9"
thorvg = { version = "=0.6.0", default-features = false, features = ["vendored", "lottie", "png"] }
tokio = { version = "1", features = ["process"] }
uuid = { version = "1", features = ["v4"] }
wsola = "0.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSValue", "NSObject", "NSError"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFString", "CFDictionary", "objc2"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime", "objc2"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "objc2"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageDestination", "objc2-core-graphics"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVAsset", "AVAssetTrack", "AVAssetImageGenerator", "AVAsynchronousKeyValueLoading", "AVMediaFormat", "AVTime", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "block2"] }
