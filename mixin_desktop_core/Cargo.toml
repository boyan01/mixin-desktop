[package]
name = "mixin_desktop_core"
version = "0.1.0"
edition = "2021"

[features]
browser-tests = []

[dependencies]
sdk = { path = "../mixin-bot-sdk", package = "mixin-bot-sdk" }
toml = "1.1.3"
serde_json = "1.0.150"
tokio-stream = "0.1.18"
async-stream = "0.3"
tokio-util = { version = "0.7.18", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
jsonwebtoken = "10"
uuid = { version = "1.23.5", features = ["v4"] }
base16ct = { version = "1.0.0", features = ["alloc"] }
ring = "0.17.14"
base64ct = { version = "1.8.3", features = ["alloc", "std"] }
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.5.0"
futures = "0.3"
flate2 = "1.1"
rand = "0.10.3"
futures-channel = "0.3.32"
log = "0.4"
lazy_static = "1.5.0"
md5 = "0.8.1"
# Signal f10ff548 protocol with maintained dependencies and compatibility checks.
libsignal-protocol = { git = "https://github.com/boyan01/libsignal.git", rev = "ec54aa3a01159edc4fa9ccb80748b450d51788ab" }
async-trait = "0.1.89"
anyhow = "1.0.103"
thiserror = "2.0.18"
url = "2.5.8"
serde_variant = "0.1.3"
strum = "0.28"
strum_macros = "0.28"
percent-encoding = "2.3.2"
aes = "0.9.1"
aes-gcm = "0.11.0"
cbc = { version = "0.2.1", features = ["alloc"] }
curve25519-dalek = "5.0.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
hex = "0.4.3"
directories = "6.0.0"
hmac = "0.13.0"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
subtle = "2.6.1"
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "stream", "socks"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
log4rs = { version = "1.4.0", default-features = false, features = ["console_appender"] }
simplelog = { version = "0.12.2", features = ["test"] }
axum = "0.8.9"
rmcp = { version = "2.2.0", features = ["transport-streamable-http-server"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "chrono", "sqlite"] }

# Select the browser backend for every getrandom version in the
# graph when targeting wasm32 (0.4 from aes-gcm/tungstenite, 0.2 from
# jsonwebtoken/ring-compat and libsignal-protocol).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "WebSocket", "MessageEvent", "BinaryType", "AbortController", "AbortSignal"] }
uuid = { version = "1.23.5", features = ["v4", "js"] }
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "stream"] }
tokio = { version = "1.52.3", features = ["rt", "time", "sync", "macros", "io-util"] }
sqlx = { version = "0.9.0", default-features = false, features = ["chrono"] }
web-time = "1"
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2-local-authentication = "0.3"
block2 = "0.6"
objc2_06 = { package = "objc2", version = "0.6" }
objc2_foundation_03 = { package = "objc2-foundation", version = "0.3" }
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSFileManager", "NSPathUtilities", "NSProcessInfo", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["test-util"] }

[[example]]
name = "browser_contract"
crate-type = ["cdylib"]
required-features = ["browser-tests"]
