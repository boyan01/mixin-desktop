[package]
name = "mixin_desktop_core"
version = "0.1.0"
edition = "2021"

[dependencies]
sdk = { path = "../mixin-bot-sdk", package = "mixin-bot-sdk" }
reqwest = { version = "0.12.5", features = ["stream"] }
serde_json = "1.0.120"
tokio = { version = "1.38.0", features = ["full"] }
tokio-stream = "0.1.15"
serde = { version = "1.0.203", features = ["derive"] }
sha2 = "0.10.8"
sha3 = "0.10.8"
jsonwebtoken = "9"
uuid = { version = "1.9.1", features = ["v4"] }
base16ct = { version = "0.2.0", features = ["alloc"] }
ring = "0.17.8"
ring-compat = "0.8.0"
ed25519 = { version = "2.2.3", features = ["alloc"] }
base64ct = { version = "1.6.0", features = ["alloc", "std"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = { version = "0.23.1", features = ["native-tls"] }
futures = "0.3"
flate2 = "1.0"
rand = "0.8.5"
rand_core = "0.5.1"
futures-channel = "0.3.30"
log = "0.4"
simplelog = { version = "0.12.2", features = ["test"] }
lazy_static = "1.5.0"
md5 = "0.7.0"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", rev = "f10ff5488899965d8d1a8504fbdf9418d04c08f2" }
sqlx = { version = "0.8.0", features = ["runtime-tokio", "chrono", "sqlite"] }
async-trait = "0.1.81"
anyhow = "1.0.86"
thiserror = "1.0.63"
url = "2.5.2"
serde_variant = "0.1.3"
strum = "0.26"
strum_macros = "0.26"
percent-encoding = "2.3.1"
aes = "0.8.4"
aes-gcm = "0.10.3"
cbc = { version = "0.1.2", features = ["alloc"] }
curve25519-dalek = "3.2.0"
x25519-dalek = "1.1.1"
hex = "0.4.3"
directories = "5.0.1"
hmac = "0.12.1"

[dev-dependencies]
tempfile = "3.10.1"
