[package]
name = "mixin_desktop_typescript"
version = "0.1.0"
edition = "2021"

[lib]
name = "mixin_desktop_typescript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = "0.8.9"
base64 = "0.22"
futures = "0.3"
mixin_desktop_api = { path = "../../mixin_desktop_api", features = ["specta"] }
mixin_desktop_media = { path = "../../mixin_desktop_media", features = ["specta"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = { version = "2.11.5", features = ["macos-private-api", "protocol-asset", "image-png"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-deep-link = "2.4.3"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.3"
tauri-plugin-single-instance = { version = "2.3.3", features = ["deep-link"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
zip = { version = "2.4", default-features = false, features = ["deflate", "aes-crypto"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
objc2-local-authentication = { version = "0.3.2", features = ["LAContext"] }
