[package]
name = "mixin-bot-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0.150"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.23.5", features = ["v4"] }
base16ct = { version = "1.0.0", features = ["alloc"] }
lazy_static = "1.5.0"
md5 = "0.8.1"
anyhow = "1.0.103"
thiserror = "2.0.18"
log = "0.4.33"
sha2 = "0.11.0"
jsonwebtoken = "10"
ring = "0.17.14"
base64ct = { version = "1.8.3", features = ["alloc", "std"] }
bytes = "1.12.1"


[dev-dependencies]
simplelog = { version = "0.12.2", features = ["test"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
tokio = { version = "1.52.3", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
uuid = { version = "1.23.5", features = ["v4", "js"] }
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "stream"] }
tokio = { version = "1.52.3", features = ["rt", "time", "sync", "macros", "io-util"] }
