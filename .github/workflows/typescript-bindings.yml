name: TypeScript bindings

on:
  pull_request:
    paths:
      - '.github/workflows/typescript-bindings.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'mixin_desktop_api/**'
      - 'mixin_desktop_core/**'
      - 'mixin_desktop_media/**'
      - 'typescript/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/typescript-bindings.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'mixin_desktop_api/**'
      - 'mixin_desktop_core/**'
      - 'mixin_desktop_media/**'
      - 'typescript/**'

jobs:
  bindings:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: typescript
        run: npm ci
      - name: Check generated bindings
        working-directory: typescript
        run: npm run check:bindings
