[workspace]
resolver = "2"
members = [
    "mixin-bot-sdk",
    "mixin_desktop_core",
    "mixin_desktop_api",
    "mixin_desktop_media",
    "mixin_desktop_headless",
    "nsh",
]

[profile.dev]
# Keep file:line in panics and backtraces without full variable debuginfo.
debug = "line-tables-only"

[profile.dev.package."*"]
# Third-party crates are rarely stepped through; their debuginfo dominates target size.
debug = false
