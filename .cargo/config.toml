[build]
target-dir = "target"

# Cargo tests and NSH's generated workspaces read this same configuration.
# The test profile inherits dev. Keep file:line information for project code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
incremental = false

# These crates are workspace members during cargo test, but dependencies of
# NSH's generated hosts. Explicit overrides keep their settings identical.
[profile.dev.package.mixin-bot-sdk]
debug = "line-tables-only"
incremental = true

[profile.dev.package.mixin_desktop_core]
debug = "line-tables-only"
incremental = true

[profile.dev.package.mixin_desktop_api]
debug = "line-tables-only"
incremental = true

[profile.dev.package.mixin_desktop_media]
debug = "line-tables-only"
incremental = true

[profile.dev.package.mixin_desktop_headless]
debug = "line-tables-only"
incremental = true

[profile.dev.package.mixin_desktop_ui]
debug = "line-tables-only"
incremental = true

# Match the native development optimizations generated by the NSH CLI.
[profile.dev.package.quickjs-jit-sys]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.objc2]
opt-level = 3

[profile.dev.package.objc2-encode]
opt-level = 3

# Stripping this proc-macro's embedded QuickJS object code can produce a
# misaligned Mach-O LINKEDIT string pool that macOS refuses to load.
[profile.dev.package.quickjs-jit-macro]
strip = "none"
